[project]
name = "deep-research-agent"
version = "0.1.0"
description = "Multi-agent deep research system built on LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-tavily>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
deep-research = "deep_research.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
